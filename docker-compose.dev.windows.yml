services:
  backend:
    command: >
      sh -c "cd /tmp && PYTHONPATH=/app alembic -c /app/alembic.ini upgrade head && cd /app && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      kokoro:
        condition: service_started

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: freelingo-kokoro
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
